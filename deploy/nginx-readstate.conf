  # BEGIN static-rss-state: read marks synced across devices -> ~/static-rss/server/readstate.js
  # on 127.0.0.1:3008. Lives in the default (apex) server, which already includes
  # snippets/rtl-auth.conf, so it is same-origin to roadtolarissa.com/static-rss/ and the
  # rtl_auth cookie (Domain=.roadtolarissa.com) rides along. Gated, but a missing session is a
  # bare 401 JSON instead of the redirect to the sign-in page: signed out, the page gets one
  # quiet 401 and carries on. proxy_set_header replaces any X-Auth-Email a client sends.
  # No add_header here: it would drop the server-level HSTS etc.; readstate.js sends no-store.
  # ^~ so the slinks regex can never take it. Copy kept in static-rss/deploy/nginx-readstate.conf.
  location ^~ /static-rss-state/ {
    auth_request /auth/check;
    auth_request_set $rss_email $upstream_http_x_auth_email;
    proxy_set_header X-Auth-Email $rss_email;
    proxy_pass http://127.0.0.1:3008;
    proxy_read_timeout 15s;
    error_page 401 = @static_rss_state_401;
    error_page 403 = @static_rss_state_401;
  }
  location @static_rss_state_401 {
    auth_request off;
    default_type application/json;
    return 401 '{"error":"signed out"}';
  }
  # END static-rss-state
