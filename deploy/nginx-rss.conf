# rss.roadtolarissa.com — the static-rss app on its own origin, installable as a
# home-screen PWA. Install: /etc/nginx/sites-available/rss.roadtolarissa.com,
# symlinked into sites-enabled. Cert: certbot certonly --webroot -w
# /usr/share/nginx/html --cert-name rss.roadtolarissa.com -d rss.roadtolarissa.com
# --deploy-hook 'systemctl reload nginx'. Port 80 is covered by the default
# site's catch-all 301 to https.
#
# Public on purpose (the same app is embedded in the /static-rss/ blog post).

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name rss.roadtolarissa.com;

  ssl_certificate     /etc/letsencrypt/live/rss.roadtolarissa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rss.roadtolarissa.com/privkey.pem;
  include snippets/ssl-params.conf;

  root  /home/demo/static-rss/public;
  index index.html;

  access_log /var/log/nginx/rss-access.log;
  error_log  /var/log/nginx/rss-error.log;

  # renewal: once this server_name exists, the http challenge redirects here
  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    allow all;
    access_log off;
  }

  # app code and generated data revalidate every load (the service worker does
  # offline); expires, unlike add_header, keeps ssl-params' security headers
  location ~ ^/(index\.html|script\.js|sw\.js|style\.css|manifest\.json|generated/.+\.json)?$ {
    expires -1;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~ /\. {
    deny all;
    access_log off;
  }
}
